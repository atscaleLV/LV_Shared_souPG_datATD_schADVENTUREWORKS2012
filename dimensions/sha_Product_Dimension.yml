unique_name: sha_Product_Dimension
object_type: dimension
label: Shared Product Dimension
hierarchies:
  - unique_name: SHA Product Hierarchy
    label: Shared Product Hierarchy
    filter_empty: 'yes'
    levels:
      - unique_name: SHA Product Category
      - unique_name: SHA Product Sub-Category
      - unique_name: SHA Product Line
      - unique_name: SHA Product Name
      - unique_name: SHA Product Code
level_attributes:
  - unique_name: SHA Product Category
    label: SHA Product Category
    contains_unique_names: false
    dataset: sha_dimproductcategory
    is_unique_key: false
    key_columns:
      - productcategorykey
    name_column: englishproductcategoryname
  - unique_name: SHA Product Sub-Category
    label: SHA Product Sub-Category
    contains_unique_names: false
    dataset: sha_dimproductsubcategory
    is_unique_key: false
    key_columns:
      - productsubcategorykey
    name_column: englishproductsubcategoryname
  - unique_name: SHA Product Line
    label: SHA Product Line
    contains_unique_names: false
    dataset: sha_dimproduct
    is_unique_key: false
    key_columns:
      - productline
    name_column: productline
  - unique_name: SHA Product Name
    label: SHA Product Name
    contains_unique_names: false
    dataset: sha_dimproduct
    is_unique_key: false
    key_columns:
      - productkey
    name_column: englishproductname
  - unique_name: SHA Product Code
    label: SHA Product Code
    contains_unique_names: false
    dataset: sha_dimproduct
    is_unique_key: false
    key_columns:
      - productkey
    name_column: productkey
relationships:
  - from:
      dataset: sha_dimproductsubcategory
      join_columns:
        - productcategorykey
    to:
      level: Product Category
    type: snowflake
  - from:
      dataset: sha_dimproduct
      join_columns:
        - productsubcategorykey
    to:
      level: Product Sub-Category
    type: snowflake
type: standard
